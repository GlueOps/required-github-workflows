name: GlueOps Standard Checks

on:
  workflow_call:
  pull_request:
    # 'edited' is required: without it, retitling a PR to fix a failed title
    # check never re-runs the check. Callers using workflow_call must include it
    # in their own trigger too.
    types: [opened, edited, synchronize, reopened]

# Commit types recognized by release-please (its DEFAULT_HEADINGS set). Anything
# outside this list is silently dropped by release-please -- parse failures are
# only logged at debug level -- so it must not be allowed here either.
#
# Breaking changes are signalled with a "!" after the type/scope (feat!: /
# feat(api)!:) or a "BREAKING CHANGE:" footer. "breaking", "major" and "hotfix"
# are NOT release-please types: release-please parses them as an ordinary type
# and falls through to a patch bump.
env:
  RELEASE_PLEASE_TYPES: "feat,fix,perf,deps,revert,docs,style,chore,refactor,test,build,ci"

jobs:
  # Job id is load-bearing: it forms the branch-protection check name
  # "PR_CHECKS_AND_LABELS / PR_CHECKS_AND_LABELS" in every calling repo.
  # Renaming it silently breaks required status checks, so it stays as-is even
  # though this workflow no longer assigns labels.
  PR_CHECKS_AND_LABELS:
    runs-on: ubuntu-latest
    steps:
      # Covers merge-commit and rebase merges, where every commit lands on the
      # default branch verbatim.
      - name: Validate Conventional Commit Messages
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Optional, for private repositories.
          allowed-commit-types: ${{ env.RELEASE_PLEASE_TYPES }}

      # Covers squash merges. squash_merge_commit_title is COMMIT_OR_PR_TITLE,
      # so the PR title becomes the commit release-please parses on a
      # multi-commit squash, and the lone commit message on a single-commit one
      # (hence validateSingleCommit).
      #
      # This action parses with conventional-changelog-conventionalcommits, the
      # same preset release-please depends on, so it understands the "!"
      # breaking-change marker natively.
      #
      # 'types' is newline-delimited here; keep it in sync with
      # RELEASE_PLEASE_TYPES above.
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          validateSingleCommit: true
